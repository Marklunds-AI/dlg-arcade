<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spela – DLG Arcade</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/arcade.css">
</head>
<body>
<div class="page">
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="wrap play-page">
      <div class="play-head">
        <div class="left">
          <a class="back" href="verktyg.html"><span id="back-icon"></span>Alla spel</a>
          <h1 id="game-title"></h1>
        </div>
        <a class="fullscreen" id="fullscreen" target="_blank" rel="noopener"><span id="ext-icon"></span>Öppna i helskärm</a>
      </div>

      <div class="frame" id="frame"><iframe id="game" title="" allow="microphone; autoplay"></iframe></div>

      <div class="about-row">
        <div class="about">
          <h2>Om spelet</h2>
          <p id="game-desc"></p>
          <div class="facts">
            <span id="game-time"></span>
            <span id="game-courses"></span>
          </div>
          <div class="banlist" id="banlist" hidden>
            <h3>Banor i spelet</h3>
            <div class="chips" id="ban-chips"></div>
          </div>
        </div>
        <aside class="scores play-scores" aria-labelledby="ps-title">
          <h2 id="ps-title"></h2>
          <div class="rows" id="play-rows" aria-live="polite"></div>
          <button class="btn btn-md btn-dark" id="refresh">Uppdatera listan</button>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
</div>

<script src="assets/js/banor.js"></script>
<script src="assets/js/arcade.js"></script>
<script>
renderChrome('verktyg');
const q = new URLSearchParams(location.search);
const t = toolById(q.get('spel')) || featuredTool();
// ?bana= och ?niva= skickas vidare till spelet (direktlänkar från lärarsidan och sökningen)
const pass = ['bana', 'niva'].filter(k => q.get(k)).map(k => k + '=' + encodeURIComponent(q.get(k))).join('&');
const gameSrc = t.href + (pass ? (t.href.includes('?') ? '&' : '?') + pass : '');
document.title = t.title + ' – DLG Arcade';
$('#back-icon').outerHTML = icon('arrow-left', 18);
$('#ext-icon').outerHTML = icon('external-link', 18);
$('#game-title').textContent = t.title;
$('#fullscreen').href = gameSrc;
$('#frame').style.background = t.bg;
$('#game').src = gameSrc;
$('#game').title = t.title;
$('#game-desc').textContent = t.desc;
$('#game-time').innerHTML = icon('clock', 18) + esc(t.time);
$('#game-courses').innerHTML = icon('graduation-cap', 18) + esc(t.courses.join(', '));
$('#ps-title').textContent = 'High score i ' + t.short;
function renderBanor() {
  const banor = toolBanor(t);
  $('#banlist').hidden = !banor.length;
  $('#ban-chips').innerHTML = banor.map(b =>
    `<a class="chip" href="${playHref(t, b.id)}" aria-pressed="${b.id === q.get('bana')}">${esc(b.namn)}</a>`).join('');
}
renderBanor();
loadSharedBanor().then(renderBanor);

async function loadScores() {
  $('#play-rows').innerHTML = statusHTML('Hämtar resultat…');
  try { $('#play-rows').innerHTML = rowsHTML(await fetchTop(t, 5), false); }
  catch (e) { $('#play-rows').innerHTML = statusHTML('Topplistan kunde inte hämtas just nu.'); }
}
$('#refresh').addEventListener('click', loadScores);
// Spelen kan meddela att ett resultat sparats → uppdatera listan direkt
window.addEventListener('message', e => { if (e.data && e.data.type === 'dlg-score-saved') loadScores(); });
loadScores();
</script>
</body>
</html>
